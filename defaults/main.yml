---
# defaults file for ansible-role-forgejo

# Forgejo version and installation settings
forgejo_target_version: "15.0.2"
forgejo_install_path: "/usr/local/bin"  # Installation directory for the forgejo binary
forgejo_os: "linux"  # Currently only linux binaries are available
forgejo_arch: "amd64"  # Options: amd64, arm64

# Git user configuration for Forgejo service
forgejo_user: "git"  # Username for Forgejo service
forgejo_group: "git"  # Group name for Forgejo service
forgejo_home: "/home/git"  # Home directory for git user
forgejo_shell: "/bin/bash"  # Shell for git user

# Forgejo directory configuration
forgejo_data_path: "/var/lib/forgejo"  # Data directory for repositories and application data
forgejo_config_path: "/etc/forgejo"  # Configuration directory for app.ini and other config files

# Database configuration
forgejo_database_type: "sqlite3"  # Options: sqlite3, mysql, postgres
forgejo_database_host: "localhost"
forgejo_database_port: 3306  # Default MySQL port
forgejo_database_name: "forgejo"
forgejo_database_user: "forgejo"
forgejo_database_password: ""  # Should be provided via vault
forgejo_database_path: "{{ forgejo_data_path }}/forgejo.db"  # For SQLite
forgejo_database_ssl_mode: "disable"  # For PostgreSQL

# Server configuration
forgejo_server_protocol: "http"  # Options: http, https
forgejo_server_domain: "localhost"
forgejo_server_http_addr: "0.0.0.0"
forgejo_server_http_port: 3000
forgejo_server_root_url: "http://localhost:3000/"
forgejo_server_disable_ssh: false
forgejo_server_ssh_domain: "{{ forgejo_server_domain }}"
forgejo_server_ssh_port: 22
forgejo_server_ssh_listen_port: 2222
# v14+: allow unexpected keys in the managed SSH authorized_keys file instead of
# aborting startup. Leave false unless migrating an instance with hand-added keys.
forgejo_server_ssh_allow_unexpected_authorized_keys: false
forgejo_server_lfs_start_server: true
forgejo_server_lfs_jwt_secret: ""  # Auto-generated if empty (used for LFS JWT authentication)
forgejo_server_enable_gzip: false
forgejo_server_landing_page: "home"  # Options: home, explore, organizations, login

# Repository configuration
forgejo_repository_root: "{{ forgejo_data_path }}/repositories"  # Root path for storing repositories
forgejo_repository_default_private: "last"  # Options: last, true, false
forgejo_repository_default_branch: "main"  # Default branch name for new repositories
forgejo_repository_disable_http_git: false  # Disable HTTP Git protocol
forgejo_repository_upload_file_max_size: 4095  # Max file size in MB
forgejo_repository_upload_max_files: 20
forgejo_repository_enable_push_create_user: false  # Allow users to create repositories by pushing to non-existent repo

# Security configuration
forgejo_security_install_lock: true  # Disable installer after setup
# SECRET_KEY and INTERNAL_TOKEN are auto-generated by Forgejo on first run if empty
# You can provide your own values for consistent deployments across multiple instances
forgejo_security_secret_key: ""  # Auto-generated if empty (used for encryption - IMPORTANT to backup)
forgejo_security_internal_token: ""  # Auto-generated if empty (used for internal API calls)
forgejo_security_min_password_length: 6  # Minimum password length
forgejo_security_disable_git_hooks: true  # Prevent custom Git hooks for security
# v13+: enforce two-factor authentication instance-wide. Options: none, all, admin
forgejo_security_global_two_factor_requirement: "none"
# v15+: name of the "remember me" auth cookie. v15 changed the default to a
# brand-independent name, which forces a one-time re-login when upgrading an
# existing instance. Set this (e.g. to your previous name) to avoid that.
# Empty = use Forgejo's built-in default (recommended for fresh installs).
forgejo_security_cookie_remember_name: ""

# OAuth2 configuration
forgejo_oauth2_jwt_secret: ""  # Auto-generated if empty (used for OAuth2 JWT authentication)

# Moderation configuration (v13+: content reporting / abuse reports)
# Periodically remove abuse reports that have already been resolved by administrators
forgejo_cron_remove_resolved_reports_enabled: false  # Enable the cleanup cron task
forgejo_cron_remove_resolved_reports_schedule: "@every 24h"  # Cron schedule for the cleanup

# Service configuration
forgejo_service_disable_registration: false
forgejo_service_require_signin_view: false
forgejo_service_register_email_confirm: false
forgejo_service_enable_captcha: false  # Enable registration captcha
forgejo_service_default_user_visibility: "public"  # Options: public, limited, private
forgejo_service_enable_notify_mail: true
forgejo_service_default_keep_email_private: false
forgejo_service_default_allow_create_organization: true
forgejo_service_default_enable_timetracking: true
forgejo_service_no_reply_address: "noreply.{{ forgejo_server_domain }}"

# Mailer configuration
forgejo_mailer_enabled: false
forgejo_mailer_protocol: "sendmail"  # Options: sendmail, smtp
forgejo_mailer_smtp_addr: ""
forgejo_mailer_smtp_port: 587
forgejo_mailer_user: ""
forgejo_mailer_passwd: ""
# v13+: read the SMTP password from a file instead of forgejo_mailer_passwd.
# When set (e.g. "file:/etc/forgejo/mailer_passwd") it takes precedence over forgejo_mailer_passwd.
forgejo_mailer_passwd_uri: ""
forgejo_mailer_from: "Forgejo <noreply@{{ forgejo_server_domain }}>"

# Cache configuration
forgejo_cache_adapter: "memory"  # Options: memory, redis, memcache
forgejo_cache_host: ""  # For redis/memcache, format: "network=tcp,addr=:6379,db=0,pool_size=100,idle_timeout=180"
forgejo_cache_item_ttl: "16h"  # Cache item time-to-live

# Session configuration
forgejo_session_provider: "file"  # Options: file, memory, redis, mysql, postgres
forgejo_session_cookie_name: "i_like_forgejo"  # Session cookie name
forgejo_session_session_life_time: 86400  # Session duration in seconds (default: 24 hours)
forgejo_session_gc_interval: 86400  # Session garbage collection interval
forgejo_session_same_site: "lax"  # Options: lax, strict, none

# Picture configuration
forgejo_picture_gravatar_source: "gravatar"  # Options: gravatar, libravatar
forgejo_picture_disable_gravatar: false  # Disable Gravatar
forgejo_picture_enable_federated_avatar: false  # Enable federated avatars

# Attachment configuration
forgejo_attachment_enabled: true  # Enable attachments
# Allowed file extensions for attachments (comma-separated list)
forgejo_attachment_allowed_types: >-
  .csv,.docx,.fodg,.fodp,.fods,.fodt,.gif,.gz,.jpeg,.jpg,.log,.md,.mov,.mp4,
  .odf,.odg,.odp,.ods,.odt,.patch,.pdf,.png,.pptx,.svg,.tgz,.txt,.webm,.xls,.xlsx,.zip
forgejo_attachment_max_size: 4  # Maximum attachment size in MB
forgejo_attachment_max_files: 5  # Maximum number of attachments per issue/PR

# Log configuration
forgejo_log_mode: "console"  # Options: console, file, conn, smtp
forgejo_log_level: "Info"  # Options: Trace, Debug, Info, Warn, Error, Critical
forgejo_log_router: "console"  # Router log mode
forgejo_log_enable_access_log: false  # Enable access logging
# Access log template format (uses Go template syntax for Forgejo, wrapped in raw block to avoid Jinja2 processing)
forgejo_log_access_log_template: ""  # Use default Apache combined log format

# Git timeout configuration (in seconds)
forgejo_git_timeout_default: 3600
forgejo_git_timeout_migrate: 6000
forgejo_git_timeout_mirror: 3000
forgejo_git_timeout_clone: 300
forgejo_git_timeout_pull: 300
forgejo_git_timeout_gc: 60

# Systemd service configuration
forgejo_service_enabled: true  # Enable and start systemd service
forgejo_service_description: "Forgejo (Beyond coding. We forge.)"  # Service description
forgejo_service_restart_sec: "2s"  # Restart delay after failure
forgejo_service_enable_capabilities: false  # Enable CAP_NET_BIND_SERVICE for low ports

# Forgejo Runner configuration (optional CI/CD runner)
forgejo_runner_enabled: false  # Enable Forgejo Runner installation and service
forgejo_runner_version: "12.10.2"  # Runner version to install
forgejo_runner_install_path: "/usr/local/bin"  # Installation directory for runner binary
forgejo_runner_os: "linux"  # Operating system for runner binary
forgejo_runner_arch: "{{ forgejo_arch }}"  # Architecture (matches Forgejo arch by default)
# Runner v12+ requires a git binary on the host (used for checkout / remote actions via git
# worktrees). The role installs git when the runner is enabled; set to false to manage it yourself.
forgejo_runner_install_git: true

# Runner user configuration
forgejo_runner_user: "runner"  # Username for runner service
forgejo_runner_group: "runner"  # Group name for runner service
forgejo_runner_home: "/home/runner"  # Home directory for runner user
forgejo_runner_shell: "/bin/bash"  # Shell for runner user

# Runner directories
forgejo_runner_config_path: "/etc/forgejo-runner"  # Configuration directory for runner
forgejo_runner_data_path: "/var/lib/forgejo-runner"  # Working directory for runner data

# Runner service configuration
forgejo_runner_service_enabled: true  # Enable and start runner systemd service
forgejo_runner_service_restart_sec: "10s"  # Restart delay after failure for runner

# Runner configuration settings (rendered into config.yml).
# Every key the runner supports can be set below. Keys whose variable is left empty ("" / [] / {})
# are omitted from config.yml so the runner falls back to its own built-in default. For any option
# not modelled here (including future upstream keys), use forgejo_runner_extra_config further down.

# log
forgejo_runner_log_level: "info"  # Runner process log level: trace, debug, info, warn, error, fatal
forgejo_runner_log_job_level: ""  # Log level for logs sent to Forgejo (defaults to log level if empty)

# runner
forgejo_runner_capacity: 1  # Number of concurrent jobs the runner can handle
forgejo_runner_timeout: 3600  # Job timeout in seconds (1 hour default; the role appends the "s" unit)
forgejo_runner_insecure: false  # Skip TLS certificate verification (not recommended for production)
forgejo_runner_labels: []  # Labels for the runner (e.g., ["docker:docker://node:20-bookworm"])
forgejo_runner_runner_file: "{{ forgejo_runner_data_path }}/.runner"  # Registration state file
forgejo_runner_envs: {}  # Extra environment variables for jobs, e.g. {KEY: value}
forgejo_runner_env_file: ""  # Path to a file with extra job environment variables (ignored if missing)
forgejo_runner_shutdown_timeout: ""  # Grace period for running jobs on shutdown, e.g. "3h" (0 = cancel now)
forgejo_runner_fetch_timeout: ""  # Timeout when fetching a job from Forgejo, e.g. "5s"
forgejo_runner_fetch_interval: ""  # Interval between job fetches, e.g. "2s"
forgejo_runner_report_interval: ""  # Interval for reporting job status/logs, e.g. "1s"
forgejo_runner_report_retry_max_retries: ""  # Max retries when reporting logs (int)
forgejo_runner_report_retry_initial_delay: ""  # Initial delay between report retries, e.g. "100ms"
forgejo_runner_report_retry_max_delay: ""  # Maximum delay between report retries, e.g. "5s"

# cache (the runner's internal actions/cache server; upstream default for `enabled` is true)
forgejo_runner_cache_enabled: ""  # true/false to enable the cache server (empty = runner default, true)
forgejo_runner_cache_dir: ""  # Directory for cache data (empty = $HOME/.cache/actcache)
forgejo_runner_cache_host: ""  # Host advertised to job containers (empty = auto-detect)
forgejo_runner_cache_port: ""  # Cache server port (int; 0 = random free port)
forgejo_runner_cache_proxy_port: ""  # Cache proxy port (int; 0 = random free port)
forgejo_runner_cache_external_server: ""  # External cache server URL (disables the internal server)
forgejo_runner_cache_actions_cache_url_override: ""  # Manual ACTIONS_CACHE_URL passed to containers
forgejo_runner_cache_secret: ""  # Shared secret for cache proxy auth (store via Ansible Vault)
forgejo_runner_cache_secret_url: ""  # File URL for the cache secret (mutually exclusive with the above)

# container (Docker/Podman execution)
forgejo_runner_container_network: ""  # Network to join: host, bridge, a custom name, or "" to auto-create
forgejo_runner_container_network_mode: ""  # Deprecated alias of network (kept for completeness)
forgejo_runner_container_enable_ipv6: ""  # true/false: enable IPv6 on auto-created networks
forgejo_runner_container_privileged: ""  # true/false: privileged containers (required for Docker-in-Docker)
forgejo_runner_container_options: ""  # Extra docker run options (e.g. "--add-host=my.forge:host-gateway")
forgejo_runner_container_workdir_parent: ""  # Parent dir of a job's workdir (empty = /workspace)
forgejo_runner_container_valid_volumes: []  # Allowed volume globs, e.g. ['**'] to allow any
forgejo_runner_container_docker_host: ""  # Override docker host ("" = auto, "-" = auto + don't mount socket)
forgejo_runner_container_force_pull: ""  # true/false: always pull images even if present
forgejo_runner_container_force_rebuild: ""  # true/false: always rebuild local images even if cached

# host (host execution, used by labels of the form "<label>:host")
forgejo_runner_host_workdir_parent: ""  # Parent dir of a job's workdir (empty = $HOME/.cache/act/)

# Runner connection / registration (Forgejo Runner v12 model)
# The deprecated `register` command is no longer used; the connection to a Forgejo instance is
# declared directly in config.yml under server.connections. Obtain the token (and uuid) from the
# Forgejo UI runners page (admin: /admin/actions/runners, org/user/repo settings -> Actions ->
# Runners). The server.connections block is rendered when the URL plus a token (or token_url) are set.
forgejo_runner_instance_url: ""  # e.g. "https://forge.example.com/"
forgejo_runner_registration_token: ""  # Registration token (store via Ansible Vault)
forgejo_runner_token_url: ""  # File URL for the token, e.g. "file:$CREDENTIALS_DIRECTORY/token.txt"
forgejo_runner_uuid: ""  # Optional runner UUID shown alongside the token in the UI
forgejo_runner_connection_name: "forgejo"  # Key used under server.connections
forgejo_runner_connection_labels: []  # Connection-specific runner labels (overrides runner.labels)
forgejo_runner_connection_fetch_interval: ""  # Per-connection job fetch interval, e.g. "5s"

# Escape hatch: any keys here are deep-merged on top of everything above, so you can set options
# not modelled by the variables (including future upstream keys). Example:
#   forgejo_runner_extra_config:
#     container:
#       options: "--cpus=2"
forgejo_runner_extra_config: {}

# Docker/Podman support for runner (optional)
forgejo_runner_enable_docker: false  # Add runner user to docker group (requires Docker installed)
